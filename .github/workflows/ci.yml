name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m pytest -q
      - name: Generate synthetic telemetry
        run: python -m src.generate_data --seed 42
      - name: Validate and ingest to DuckDB
        run: python -m src.ingest
      - name: Run dbt models and tests
        run: dbt build --project-dir dbt_project --profiles-dir dbt_project
      - name: Emit explainable OOS evidence
        run: |
          python - <<'PY'
          import duckdb
          from src.oos import evaluate_oos

          con = duckdb.connect('warehouse/batch.duckdb')
          cursor = con.execute('select * from raw_batch_telemetry')
          columns = [item[0] for item in cursor.description]
          rows = [dict(zip(columns, values)) for values in cursor.fetchall()]
          con.close()
          flags = evaluate_oos(rows)
          assert flags, 'expected deterministic OOS examples'
          print(flags[:5])
          PY
