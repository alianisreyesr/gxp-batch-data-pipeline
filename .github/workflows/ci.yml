name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests with coverage
        run: python -m pytest -q --cov=src --cov-report=term-missing --cov-fail-under=80
      - name: Run canonical evidence-producing pipeline
        run: python -m src.pipeline --seed 42
      - name: Assert deterministic run evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('artifacts/run_manifest.json').read_text(encoding='utf-8'))
          assert manifest['counts'] == {
              'generated_rows': 96,
              'accepted_rows': 96,
              'rejected_rows': 0,
              'oos_flags': 2,
          }
          assert manifest['oos_by_rule'] == {
              'CPP-TEMP-001': 1,
              'CQA-ASSAY-001': 1,
          }
          assert len(manifest['source_sha256']) == 64
          assert manifest['run_id'] == f"run-{manifest['source_sha256'][:16]}"
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - name: Verify generated run evidence
        run: python -m src.verify_evidence
      - name: Run dbt models and tests
        run: dbt build --project-dir dbt_project --profiles-dir dbt_project
